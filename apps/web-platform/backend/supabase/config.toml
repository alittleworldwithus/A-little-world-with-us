# Supabase CLI project configuration for the backend boundary.
# Production migrations are tracked remotely; the repository's bootstrap SQL
# under ./bootstrap is kept as the canonical fresh-environment schema source.
project_id = "mktfnwdvzbdrxfcvnolp"

[api]
enabled = true
port = 54321

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# These scheduled-job endpoints intentionally disable Supabase JWT verification.
# Each handler independently validates its dedicated x-job-secret against a
# restricted SECURITY DEFINER verifier that is executable only by service_role.
# Keep these overrides in sync with the deployed function settings.
[functions.reveal-surprises]
verify_jwt = false

[functions.check-geofence]
verify_jwt = false

[functions.check-battery]
verify_jwt = false

[functions.check-missed-checkin]
verify_jwt = false
